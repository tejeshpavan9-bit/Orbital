<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbital — Everything revolving around a student's daily routine</title>
<meta name="description" content="Orbital is a student-powered knowledge-sharing platform: notes, videos, quizzes and study groups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Rammetto+One&display=swap">
<style>
/* Layout: cream panel of dashed bento cells on a dark ground, coral display type with a yellow outline. */
:root{--ink:#2b2321;--muted:#6e625f;--coral:#ee5a49;--sun:#ffc83d;--paper:#fcf3ee;--cell:#fbeee8;--tile:#fde7de;--dash:#e6aa9c;--line:#ecd3c9;--grid:#f4dcd2;--danger:#b42318;--ok:#1a7f37;--heart:#d9344f;--display:'Rammetto One','Arial Black',Impact,sans-serif;--body:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#1c130e;background-image:radial-gradient(ellipse 80% 35% at 50% 108%,#6a4119 0%,rgba(28,19,14,0) 70%);background-attachment:fixed;color:var(--ink);font:16px/1.55 var(--body)}
h1,h2,h3{font-family:var(--body);margin:0}
h1{font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;margin:28px 0 12px}
h3{font-size:20px;line-height:1.3;font-weight:700}
a{color:inherit}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.fine{font-size:12.5px;color:var(--muted);line-height:1.45}
.pre{white-space:pre-wrap;word-wrap:break-word}
.sub{color:var(--muted);font-size:14px}
.lbl-h{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin:0 0 14px}
#shell{max-width:1200px;margin:28px auto;background:var(--paper);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 56px)}
.cell{border:1.5px dashed var(--dash);border-radius:18px;background:var(--cell)}
#top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;position:sticky;top:0;z-index:20;background:var(--paper);margin:-16px -16px 0;padding:16px 16px 6px;border-radius:26px 26px 0 0}
.navcell{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:12px 24px}
.actcell{display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--display);font-size:15px;text-transform:uppercase;color:var(--coral);letter-spacing:.02em;flex:none}
.topnav{display:flex;gap:6px 22px;flex-wrap:wrap;justify-content:flex-end}
.topnav a{text-decoration:none;font-size:14.5px;padding:4px 0;border-bottom:2px solid transparent}
.topnav a:hover{border-bottom-color:var(--dash)}
.topnav a.on{border-bottom-color:var(--coral);font-weight:700}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e7c9bf;border-radius:999px;padding:0 14px;width:210px;color:var(--muted)}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:14.5px;padding:8px 0;background:transparent;color:var(--ink);min-width:0;width:100%}
#topAvatar{display:flex}
#main{display:block;flex:1}
.page{padding:26px 28px}
.page.narrow{max-width:820px;width:100%;margin:0 auto}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-family:var(--display);text-transform:uppercase;color:var(--coral);-webkit-text-stroke:5px var(--sun);paint-order:stroke fill;font-size:clamp(22px,3.4vw,32px);line-height:1.15;letter-spacing:.01em;font-weight:400}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:999px;padding:9px 20px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--tile);opacity:1}
.btn.cta{background:#fff4ee;color:var(--coral);border:1.5px solid var(--coral);text-transform:uppercase;font-size:13.5px;letter-spacing:.03em;font-weight:700}
.btn.cta:hover{background:#ffe9df;opacity:1}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger)}
.btn.wide{width:100%;margin:8px 0;grid-column:1/-1}
.lnk{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;text-decoration:underline}
.lnk.danger{color:var(--danger)}
.home{display:grid;gap:12px;grid-template-columns:minmax(0,2.5fr) minmax(0,1fr);grid-template-areas:"hero side" "bl side" "feed feed"}
.hero{grid-area:hero;position:relative;overflow:hidden;background-color:#fdf1ea;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:30px 32px;min-height:300px}
.herotxt{max-width:430px;position:relative;z-index:1}
.hero-h{font-family:var(--display);text-transform:uppercase;color:var(--coral);-webkit-text-stroke:8px var(--sun);paint-order:stroke fill;font-size:clamp(30px,4.4vw,50px);line-height:1.1;margin:0 0 16px;font-weight:400}
.herotxt p{font-size:16.5px;margin-bottom:20px}
.art{width:min(300px,38%);height:auto;flex:none}
.side{grid-area:side;display:flex;flex-direction:column;gap:12px}
.side .cell{padding:20px;display:flex;flex-direction:column;gap:10px}
.side .lbl-h{margin-bottom:4px}
.groupcell{flex:1}
.groupcell p{font-size:14.5px}
.bl{grid-area:bl;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px}
.subj{padding:18px;display:flex;flex-wrap:wrap;gap:8px;align-content:center;justify-content:center;min-height:170px}
.subj .muted{font-size:14px;text-align:center;margin:0}
.pill{background:#fff;border:1px solid var(--ink);border-radius:999px;padding:6px 16px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink);transform:rotate(var(--r,0deg))}
.pill:hover{background:var(--tile)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--ink);border-radius:14px;background:var(--tile);padding:18px 10px;text-decoration:none}
.stat b{font-size:34px;font-weight:800;line-height:1.1}
.stat span{font-size:15px;color:#4a3f3c}
.stat:hover{background:#ffd9cb}
.feedcell{grid-area:feed;padding:22px 24px}
#feed,#lres,#dres,#pres{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.empty{grid-column:1/-1;border:1.5px dashed var(--dash);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted);background:#fff7f3}
.empty p{margin-bottom:14px}
.card{background:var(--tile);border:1.5px dashed var(--dash);border-radius:16px;padding:18px;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--coral);border-style:solid}
.card .actions{margin-top:auto}
.byline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.byline b{color:var(--ink);font-weight:600}
.card h3{margin:10px 0 6px;overflow-wrap:anywhere}
.desc{color:#4a3f3c;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tag{font-size:12.5px;background:#fff;border:1px solid var(--ink);border-radius:999px;padding:1px 11px;color:var(--ink)}
.actions{display:flex;gap:6px;align-items:center;margin-top:8px}
.act{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:999px;font:inherit;font-size:14px;text-decoration:none}
.act:hover{background:#fff;color:var(--ink)}
.act.on{color:var(--ink)}
.act[data-act="like"].on{color:var(--heart)}
.act .n{min-width:6px}
.vthumb{position:relative;aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--coral);overflow:hidden;margin:6px 0 8px}
.vthumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.vthumb .ic{position:relative;z-index:1}
.vthumb.ready .ic{color:#fff;background:rgba(0,0,0,.55);border-radius:50%;padding:12px;width:52px;height:52px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:16px}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{flex:1;min-width:140px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #e1c3b9;border-radius:12px;padding:9px 12px;width:100%}
input[type=radio],input[type=checkbox]{width:auto}
input:focus,textarea:focus,select:focus{outline:2px solid #ee5a4940;border-color:var(--coral)}
textarea{resize:vertical}
label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}
label input,label textarea,label select{margin-top:5px;font-weight:400}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.err{color:var(--danger);font-size:14px;margin:6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--ink);background:#fff;border-radius:999px;padding:5px 16px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.av{border-radius:50%;object-fit:cover;flex:none;background:#fff}
.av.ph{display:inline-flex;align-items:center;justify-content:center;color:var(--coral);font-weight:700;border:1px solid var(--dash);background:#fff}
.ic{flex:none}
.tabs{display:flex;gap:4px;border-bottom:1.5px dashed var(--dash);margin:20px 0 6px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font:inherit;font-size:15px;color:var(--muted);cursor:pointer;text-decoration:none;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--coral);font-weight:700}
.player video{width:100%;max-height:70vh;background:#000;border-radius:14px;display:block}
.pdfbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:14px 0}
.pdfpage{background:#fff;margin:0 auto 10px;box-shadow:0 0 0 1px var(--line);min-height:300px;position:relative}
.pdfpage canvas{width:100%;height:auto;display:block}
.pdfpage .pn{position:absolute;right:8px;top:6px;font-size:12px;color:var(--muted)}
.pdfbox iframe{width:100%;height:70vh;border:0;background:#fff}
.cm{padding:12px 0;border-top:1.5px dashed var(--dash)}
.cm .byline{margin-bottom:4px}
.cm .lnk{margin-left:auto}
.cform{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.cform textarea,.cform input{flex:1}
.ov{position:fixed;inset:0;background:rgba(28,19,14,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--paper);border:1.5px dashed var(--coral);border-radius:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.dlg.wide{max-width:680px}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1.5px dashed var(--dash);position:sticky;top:0;background:var(--paper);z-index:2}
.dh h2{margin:0;font-size:18px}
.x{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;display:flex}
.db{padding:18px 22px 22px}
.vbox{position:relative;background:#111;border-radius:14px;aspect-ratio:16/9;overflow:hidden;margin-bottom:10px}
.vbox video{width:100%;height:100%;object-fit:contain;display:block;background:#111}
.vph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#c9bcb7;padding:20px;font-size:14px}
#timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--danger);align-self:center}
.qb{border:1.5px dashed var(--dash);border-radius:14px;padding:12px 14px;margin:0 0 14px;background:#fff7f3}
.qb legend{font-weight:700;font-size:14px;padding:0 6px}
.opt{display:flex;gap:8px;align-items:center;margin-top:8px}
.opt .x2{background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
.qa{border:0;padding:0;margin:0 0 22px}
.qa legend{font-weight:600;font-size:17px;margin-bottom:8px;padding:0}
.ao{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:16px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;margin:0 0 8px;cursor:pointer}
.ao.right{border-color:var(--ok);background:#f1faf3}
.ao.wrong{border-color:var(--danger);background:#fdf3f2}
.ao .lab{margin-left:auto;font-size:12.5px;font-weight:700;white-space:nowrap}
.score{font-family:var(--display);font-size:26px;margin:0 0 18px;color:var(--coral)}
.stu{display:flex;gap:12px;align-items:center;padding:16px;background:var(--tile);border:1.5px dashed var(--dash);border-radius:16px;cursor:pointer}
.msg{padding:10px 0;border-top:1.5px dashed var(--dash)}
.chatlog{max-height:50vh;overflow-y:auto;border-bottom:1.5px dashed var(--dash);margin-bottom:12px}
.chatlog .msg:first-child{border-top:0}
.att{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:#fff;border-radius:999px;padding:6px 12px;text-decoration:none;font-size:14px;margin-top:4px}
.mem{display:flex;gap:10px;flex-wrap:wrap}
.mem span{display:flex;align-items:center;gap:8px;border:1px solid var(--ink);background:#fff;border-radius:999px;padding:4px 14px 4px 6px;font-size:14px}
.pick{display:flex;gap:10px;align-items:center;font-weight:400;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:8px}
.pick small{color:var(--muted);margin-left:auto}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:200;max-width:90vw}
#bottom{display:none}
.menu{display:grid;gap:8px}
.menu button{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;cursor:pointer}
.menu button:hover{background:var(--tile)}
.menu small{display:block;color:var(--muted)}
.notice{border:1.5px dashed var(--dash);background:#fff7f3;border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3c;margin:0 0 16px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:10px;padding:3px;gap:3px}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font:inherit;font-size:15px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;color:inherit}
.seg button.on{background:var(--ink);color:#fff}
.callbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1.5px solid #2f8f4e;background:#eef9f1;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.callbar .who{flex:1;min-width:180px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px}
.vtile{position:relative;background:#111;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.vtile video{width:100%;height:100%;object-fit:cover;display:block}
.vtile[data-k="me"] video{transform:scaleX(-1)}
.vtile.aud video{display:none}
.vtile.aud::before{content:attr(data-i);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#fff}
.vname{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:2px 8px;border-radius:6px}
.cafe{--bg:#f4ead5;--surface:#fffdf8;--ink:#3b2f2a;--muted:#7a6b60;--green:#7b2d3b;--green-ink:#fffdf8;--amber:#b8913f;--line:#e6dccb;--free:#eaeedf;--taken:#ece5da;--pick:#7b2d3b;font-family:Georgia,'Palatino Linotype',Palatino,'Times New Roman',serif;color:var(--ink);line-height:1.55;max-width:760px;margin:0 auto}
.cafe h1,.cafe h2,.cafe h3,.cafe button,.cafe input,.cafe select{font-family:inherit}
.cafe .cf-head{padding:6px 0 14px;text-align:center;border-bottom:3px double var(--amber)}
.cafe .cf-head h1{font-size:2.1rem;margin:0;letter-spacing:.04em;font-weight:normal;color:var(--green)}
.cafe .cf-head p{margin:4px 0 0;color:var(--muted)}
.cafe section[hidden]{display:none}
.cafe .cf-tabs{margin:14px 0 16px;padding:0}
.cafe .cf-tabs{display:flex;gap:6px;max-width:760px;margin:14px auto 0;padding:0 18px;border-bottom:1px solid var(--line)}
.cafe .cf-tabs button{flex:1;background:none;border:0;padding:12px 6px;font-size:.95rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.cafe .cf-tabs button[aria-selected=true]{color:var(--green);border-color:var(--green);font-weight:700}
.cafe .cf-tabs button:focus-visible,.cafe .cf-btn:focus-visible,.cafe .cf-seat:focus-visible,.cafe .cf-chip:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.cafe input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:1rem;margin-bottom:12px}
.cafe .cf-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;color:var(--ink);font-size:1rem}
.cafe .cf-row small{color:var(--muted);display:block;font-size:.85rem}
.cafe .cf-tag{background:var(--free);color:var(--ink);padding:3px 9px;border-radius:99px;font-size:.8rem;white-space:nowrap;font-family:"Trebuchet MS",sans-serif}
.cafe .cf-detail{background:var(--surface);border:1px solid var(--green);border-radius:8px;padding:14px;margin:-2px 0 10px}
.cafe .cf-detail b{color:var(--green)}
.cafe .cf-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.cafe .cf-chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;font-size:.92rem}
.cafe .cf-chip[aria-pressed=true]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.cafe .cf-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.cafe .cf-btn{background:var(--green);color:var(--green-ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.9rem}
.cafe .cf-btn.alt{background:transparent;color:var(--green);border:1px solid var(--green)}
.cafe .cf-cart{background:var(--surface);border:2px dashed var(--amber);border-radius:8px;padding:14px;margin-top:16px}
.cafe .cf-stage{background:var(--green);color:var(--green-ink);text-align:center;padding:6px;border-radius:6px;font-family:"Trebuchet MS",sans-serif;font-size:.85rem;margin-bottom:14px}
.cafe .cf-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.cafe .cf-seat{padding:12px 0;border:1px solid var(--line);border-radius:8px;background:var(--free);color:var(--ink);cursor:pointer;font-size:.9rem}
.cafe .cf-seat:disabled{background:var(--taken);color:var(--muted);cursor:not-allowed;text-decoration:line-through}
.cafe .cf-seat[aria-pressed=true]{background:var(--pick);color:var(--green-ink);border-color:var(--pick)}
.cafe .cf-legend{display:flex;gap:14px;font-size:.85rem;color:var(--muted);margin-bottom:12px;font-family:"Trebuchet MS",sans-serif}
.cafe .cf-ok{background:var(--free);border-radius:8px;padding:12px 14px;margin-top:12px}
.cafe select{padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;margin-right:8px}
.cls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.clscol{background:#fff7f3;border:1.5px dashed var(--dash);border-radius:16px;padding:18px;min-width:0}
.clscol form textarea{margin-bottom:8px}
.dq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.dq.fresh{border-color:var(--coral)}
.dq p{margin:6px 0 0}
.dq .st{margin-left:auto}

<body>
<noscript>Orbital needs JavaScript to run.</noscript>
<div id="shell">
  <header id="top"></header>
  <main id="main"></main>
</div>
<nav id="bottom" aria-label="Primary"></nav>
<div id="modal-root"></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const LABEL={notes:'Note',videos:'Video',quizzes:'Quiz',posts:'Post'};
const TYPE_ICON={notes:'notes',videos:'video',quizzes:'quiz',posts:'comment'};
const PAGE=10;
const S={route:'#/',tok:0,urls:[],ios:[],cleanups:[],me:null};

const ICONS={
home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
discover:'<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
notes:'<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
video:'<path d="m22 8-6 4 6 4V8z"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
quiz:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"/>',
comment:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
bookmark:'<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
trash:'<polyline points="3 6 5 6 21 6"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
edit:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
play:'<polygon points="6 3 20 12 6 21 6 3"/>',
pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
stop:'<rect x="5" y="5" width="14" height="14" rx="1"/>',
send:'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
back:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
rec:'<circle cx="12" cy="12" r="7"/>',
coffee:'<path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/>',
phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
board:'<rect x="3" y="3" width="18" height="12" rx="2"/><path d="M12 15v6M8 21h8"/>',
arrow:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>'
};
const ic=(n,s=18,fill=false)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
const LOGO='<svg width="24" height="24" viewBox="0 0 32 32" fill="none" stroke="#ee5a49" stroke-width="2.4" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="#ee5a49"/><ellipse cx="16" cy="16" rx="13" ry="6" transform="rotate(-25 16 16)"/></svg>';

function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(0)+' KB';if(b<1073741824)return (b/1048576).toFixed(1)+' MB';return (b/1073741824).toFixed(2)+' GB'}
const myName=()=>(S.me&&S.me.name)||'Anonymous student';
function avatar(p,size=22){
  const st=`width:${size}px;height:${size}px;font-size:${Math.round(size*.45)}px`;
  if(p&&p.avatar)return `<img class="av" style="${st}" src="${esc(p.avatar)}" alt="">`;
  const n=(p&&p.name||'').trim();
  return `<span class="av ph" style="${st}">${n?esc(n[0].toUpperCase()):ic('user',Math.round(size*.6))}</span>`;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
const storageMsg=ex=>(ex&&ex.name==='QuotaExceededError')?'Browser storage is full. Delete some content or use a smaller file.':'Could not save: '+((ex&&ex.message)||'unknown error');

/* ---------- IndexedDB ---------- */
const STORES=['profiles','notes','videos','quizzes','attempts','groups','messages','comments','likes','bookmarks','members','posts'];
let _db=null;
function openDB(){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('IndexedDB is not available in this browser.'));
  const r=indexedDB.open('orbital-prototype',1);
  r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})})};
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error||new Error('Could not open local storage.'));
  r.onblocked=()=>rej(new Error('Local storage is blocked by another Orbital tab.'));
})}
const tx=(store,mode,fn)=>new Promise((res,rej)=>{
  let t;try{t=_db.transaction(store,mode)}catch(e){return rej(e)}
  let out;const rq=fn(t.objectStore(store));
  if(rq)rq.onsuccess=()=>{out=rq.result};
  t.oncomplete=()=>res(out);
  t.onerror=()=>rej(t.error);
  t.onabort=()=>rej(t.error||new Error('Transaction aborted'));
});
const DB={
  get:(s,id)=>tx(s,'readonly',o=>o.get(id)),
  all:s=>tx(s,'readonly',o=>o.getAll()),
  put:(s,v)=>tx(s,'readwrite',o=>o.put(v)),
  del:(s,id)=>tx(s,'readwrite',o=>o.delete(id))
};

/* ---------- data helpers ---------- */
async function loadMe(){
  S.me=(await DB.get('profiles','me'))||{id:'me',name:'',bio:'',college:'',branch:'',semester:'',avatar:''};
}
async function loadEng(){
  const [L,B,C]=await Promise.all([DB.all('likes'),DB.all('bookmarks'),DB.all('comments')]);
  const e={likes:new Set(L.map(x=>x.id)),marks:new Set(B.map(x=>x.id)),comments:{}};
  C.forEach(c=>{const k=c.type+':'+c.targetId;e.comments[k]=(e.comments[k]||0)+1});
  return e;
}
async function allContent(){
  const ts=['notes','videos','quizzes','posts'];
  const res=await Promise.all(ts.map(s=>DB.all(s)));
  return res.flatMap((arr,i)=>arr.map(x=>({...x,_t:ts[i]}))).sort((a,b)=>b.createdAt-a.createdAt);
}
async function subjectList(){
  const out=[];
  for(const s of['notes','videos','quizzes'])(await DB.all(s)).forEach(x=>x.subject&&out.push(x.subject));
  return [...new Set(out)].sort((a,b)=>a.localeCompare(b));
}
async function removeItem(t,id){
  await DB.del(t,id);
  for(const c of await DB.all('comments'))if(c.type===t&&c.targetId===id)await DB.del('comments',c.id);
  await DB.del('likes',t+':'+id);await DB.del('bookmarks',t+':'+id);
  if(t==='quizzes')for(const a of await DB.all('attempts'))if(a.quizId===id)await DB.del('attempts',a.id);
}

/* ---------- UI primitives ---------- */
function openModal(title,html,opts={}){
  const root=$('#modal-root');
  const el=document.createElement('div');el.className='ov';
  el.innerHTML=`<div class="dlg ${opts.wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dh"><h2>${esc(title)}</h2><button class="x" type="button" aria-label="Close" data-close>${ic('x',20)}</button></div><div class="db">${html}</div></div>`;
  root.appendChild(el);document.body.style.overflow='hidden';
  let closed=false;
  const onKey=e=>{if(e.key==='Escape'&&!opts.sticky)close()};
  function close(){
    if(closed)return;closed=true;
    document.removeEventListener('keydown',onKey);
    if(opts.onClose)opts.onClose();
    el.remove();if(!root.children.length)document.body.style.overflow='';
  }
  document.addEventListener('keydown',onKey);
  el.addEventListener('mousedown',e=>{if(e.target===el&&!opts.sticky)close()});
  $$('[data-close]',el).forEach(b=>b.addEventListener('click',close));
  return {el,close,body:$('.db',el)};
}
function confirmBox(msg,label='Delete'){
  return new Promise(res=>{
    const m=openModal('Please confirm',`<p>${esc(msg)}</p><div class="row end"><button class="btn ghost" data-close>Cancel</button><button class="btn danger-solid" id="yes">${esc(label)}</button></div>`,{onClose:()=>res(false)});
    $('#yes',m.el).onclick=()=>{res(true);m.close()};
  });
}
function go(h){S.route=h;render()}
const emptyState=(msg,action='')=>`<div class="empty"><p>${esc(msg)}</p>${action}</div>`;
const notFound=what=>`<div class="empty"><p>${esc(what)} not found. It may have been deleted.</p><a class="btn ghost" href="#/">Go to Home</a></div>`;
const tagsHtml=it=>{const a=[it.subject,it.branch,it.semester&&('Sem '+it.semester)].filter(Boolean);return a.length?`<div class="tags">${a.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''};

/* ---------- cards ---------- */
function btnInner(kind,on){return kind==='like'?`${ic('heart',18,on)}<span class="n">${on?1:''}</span>`:ic('bookmark',18,on)}
function actBtns(t,id,eng){
  const k=t+':'+id,liked=eng.likes.has(k),marked=eng.marks.has(k),cc=eng.comments[k]||0;
  return `<button class="act ${liked?'on':''}" data-act="like" data-t="${t}" data-id="${id}" aria-label="Like" title="Like">${btnInner('like',liked)}</button>
  <button class="act" data-act="open" data-href="#/${t}/${id}?c=1" aria-label="Comments" title="Comments">${ic('comment',18)}<span class="n">${cc||''}</span></button>
  <button class="act ${marked?'on':''}" data-act="mark" data-t="${t}" data-id="${id}" aria-label="Bookmark" title="Bookmark">${btnInner('mark',marked)}</button>`;
}
function card(it,eng){
  const t=it._t;
  let body='';
  if(t==='posts')body=`${it.title?`<h3>${esc(it.title)}</h3>`:''}<p class="desc pre" style="margin-top:${it.title?0:10}px">${esc(it.body)}</p>`;
  else{
    body=`<h3>${esc(it.title)}</h3>${it.description?`<p class="desc">${esc(it.description)}</p>`:''}`;
    if(t==='videos')body+=`<div class="vthumb" data-vid="${it.id}">${ic('play',28,true)}</div>`;
    if(t==='notes')body+=`<div class="sub">PDF · ${fmtSize(it.size||0)}</div>`;
    if(t==='quizzes')body+=`<div class="sub">${it.questions.length} question${it.questions.length===1?'':'s'}</div>`;
    body+=tagsHtml(it);
  }
  return `<article class="card" data-open="#/${t}/${it.id}">
    <div class="byline">${avatar(S.me,22)}<b>${esc(myName())}</b><span>·</span><span>${LABEL[t]}</span><span>·</span><span>${ago(it.createdAt)}</span></div>
    ${body}<div class="actions">${actBtns(t,it.id,eng)}</div></article>`;
}
function studentCard(p){
  const d=[p.college,p.branch,p.semester&&('Semester '+p.semester)].filter(Boolean).join(' · ');
  return `<div class="stu" data-open="#/profile">${avatar(p,44)}<div><b>${esc(p.name)}</b><div class="sub">${esc(d)}</div>${p.bio?`<div class="desc" style="margin:2px 0 0">${esc(p.bio)}</div>`:''}</div></div>`;
}
const cardAny=(it,eng)=>it._t==='students'?studentCard(it):card(it,eng);

function paintList(el,items,eng,emptyHtml,fn=card){
  el.innerHTML='';
  if(!items.length){el.innerHTML=emptyHtml;return}
  let shown=0;
  const more=document.createElement('button');more.className='btn ghost wide';more.textContent='Load more';
  more.onclick=next;
  el.appendChild(more);
  function next(){
    const slice=items.slice(shown,shown+PAGE);shown+=slice.length;
    more.insertAdjacentHTML('beforebegin',slice.map(i=>fn(i,eng)).join(''));
    hydrateThumbs(el);
    if(shown>=items.length)more.remove();
  }
  next();
}
function hydrateThumbs(root){
  const els=$$('.vthumb:not([data-h])',root);if(!els.length||!window.IntersectionObserver)return;
  const io=new IntersectionObserver(async es=>{
    for(const en of es){
      if(!en.isIntersecting)continue;
      const el=en.target;io.unobserve(el);
      try{
        const rec=await DB.get('videos',el.dataset.vid);
        if(!rec||!el.isConnected)continue;
        const u=URL.createObjectURL(rec.file);S.urls.push(u);
        const v=document.createElement('video');v.muted=true;v.preload='metadata';v.playsInline=true;v.src=u+'#t=0.1';
        v.onloadeddata=()=>el.classList.add('ready');
        el.prepend(v);
      }catch(e){}
    }
  },{rootMargin:'200px'});
  els.forEach(e=>{e.dataset.h=1;io.observe(e)});S.ios.push(io);
}

/* ---------- shell / router ---------- */
const NAV=[
 {k:'home',h:'#/',l:'Home',s:'Home',i:'home'},
 {k:'discover',h:'#/discover',l:'Discover',s:'Discover',i:'discover'},
 {k:'notes',h:'#/notes',l:'Notes',s:'Notes',i:'notes'},
 {k:'videos',h:'#/videos',l:'Videos',s:'Videos',i:'video'},
 {k:'quizzes',h:'#/quizzes',l:'Quizzes',s:'Quizzes',i:'quiz'},
 {k:'groups',h:'#/groups',l:'Group Study',s:'Groups',i:'users'},
 {k:'classroom',h:'#/classroom',l:'Live Classroom',s:'Class',i:'board'},
 {k:'library',h:'#/library',l:'Library',s:'Library',i:'notes'},
 {k:'profile',h:'#/profile',l:'Profile',s:'Profile',i:'user'}
];
function shell(){
  $('#top').innerHTML=`<div class="cell navcell"><a class="logo" href="#/" aria-label="Orbital home">${LOGO}<span>Orbital</span></a><nav class="topnav" id="topnav" aria-label="Primary">${NAV.map(n=>`<a data-nav="${n.k}" href="${n.h}">${n.l}</a>`).join('')}</nav></div>
  <div class="cell actcell"><form class="search" id="gs" role="search">${ic('search',16)}<input name="q" placeholder="Search Orbital" aria-label="Search Orbital" autocomplete="off"></form><button class="btn createbtn" data-act="create" aria-label="Create">${ic('plus',16)}<span class="lbl">Create</span></button><a id="topAvatar" href="#/profile" aria-label="Profile"></a></div>`;
  $('#bottom').innerHTML=NAV.map(n=>`<a data-nav="${n.k}" href="${n.h}">${ic(n.i,20)}<span>${n.s}</span></a>`).join('');
  $('#gs').onsubmit=e=>{e.preventDefault();const q=new FormData(e.target).get('q').trim();go('#/discover'+(q?'?q='+encodeURIComponent(q):''));e.target.reset()};
  refreshChrome();
}
function refreshChrome(){const a=$('#topAvatar');if(a)a.innerHTML=avatar(S.me,32)}
function parseHash(){const h=(S.route||'#/').slice(1)||'/';const i=h.indexOf('?');const path=i<0?h:h.slice(0,i);return{seg:path.split('/').filter(Boolean),q:new URLSearchParams(i<0?'':h.slice(i+1))}}
function cleanup(){
  S.urls.forEach(u=>URL.revokeObjectURL(u));S.urls=[];
  S.ios.forEach(o=>o.disconnect());S.ios=[];
  S.cleanups.forEach(f=>{try{f()}catch(e){}});S.cleanups=[];
}
function setMain(tok,html,raw){if(tok!==S.tok)return false;$('#main').innerHTML=raw?html:`<section class="cell page${S.narrow?' narrow':''}">${html}</section>`;return true}
async function render(){
  cleanup();const tok=++S.tok;
  const {seg,q}=parseHash();const name=seg[0]||'home';
  S.narrow=(['notes','videos','quizzes','posts'].includes(name)&&!!seg[1])||name==='room';
  const navKey=name==='posts'?'home':(name==='room'?'groups':name);
  if(name!=='room'&&(location.hash||'').startsWith('#room-')){try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}}
  $$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===navKey));
  try{
    if(name==='home')await vHome(tok);
    else if(name==='discover')await vDiscover(tok,q);
    else if(['notes','videos','quizzes'].includes(name))seg[1]?await vDetail(tok,name,seg[1],q):await vList(tok,name);
    else if(name==='posts'&&seg[1])await vDetail(tok,'posts',seg[1],q);
    else if(name==='groups')await vGroups(tok);
    else if(name==='room'&&seg[1])await vRoom(tok,seg[1]);
    else if(name==='classroom')await vClassroom(tok);
    else if(name==='library')await vCafe(tok);
    else if(name==='profile')await vProfile(tok,q);
    else setMain(tok,notFound('Page'));

async function showPdf(box,blob){
  const fallback=msg=>{
    const u=URL.createObjectURL(blob);S.urls.push(u);
    box.innerHTML=`${msg?`<p class="muted" style="margin:6px">${esc(msg)}</p>`:''}<iframe title="PDF preview" src="${u}"></iframe>`;
  };
  if(!window.pdfjsLib)return fallback('The PDF viewer library could not load (are you offline?). Using your browser\'s built-in viewer instead.');
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
    S.cleanups.push(()=>{try{pdf.destroy()}catch(e){}});
    box.innerHTML='';
    const io=new IntersectionObserver(es=>{es.forEach(async en=>{
      if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);
      try{
        const page=await pdf.getPage(+el.dataset.p);
        const w=el.clientWidth||600;const base=page.getViewport({scale:1});
        const scale=w/base.width,dpr=Math.min(window.devicePixelRatio||1,2);
        const vp=page.getViewport({scale:scale*dpr});
        const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
        await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        el.style.minHeight='0';el.prepend(c);
      }catch(e){}
    })},{rootMargin:'400px'});
    S.ios.push(io);
    for(let i=1;i<=pdf.numPages;i++){
      const d=document.createElement('div');d.className='pdfpage';d.dataset.p=i;
      d.innerHTML=`<span class="pn">Page ${i} of ${pdf.numPages}</span>`;
      box.appendChild(d);io.observe(d);
    }
  }catch(e){fallback('Could not render this PDF with the built-in viewer.')}
}

/* ---------- Quiz attempt ---------- */
function paintQuiz(box,it){
  box.innerHTML=`<form id="qa">${it.questions.map((q,i)=>`<fieldset class="qa"><legend>${i+1}. ${esc(q.q)}</legend>${q.options.map((o,j)=>`<label class="ao"><input type="radio" name="q${i}" value="${j}" required><span>${esc(o)}</span></label>`).join('')}</fieldset>`).join('')}<button class="btn">Submit answers</button></form><div id="qres"></div><div id="atts"></div>`;
  $('#qa',box).onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.target);
    const answers=it.questions.map((_,i)=>+fd.get('q'+i));
    const score=answers.reduce((s,a,i)=>s+(a===it.questions[i].correct?1:0),0);
    try{await DB.put('attempts',{id:uid(),quizId:it.id,answers,score,total:it.questions.length,createdAt:Date.now()})}catch(ex){return toast(storageMsg(ex))}
    showQuizResult(box,it,answers,score);
  };
  paintAttempts(it);
}
function showQuizResult(box,it,answers,score){
  const pct=Math.round(score/it.questions.length*100);
  $('#qa',box).hidden=true;
  $('#qres',box).innerHTML=`<p class="score">You scored ${score} / ${it.questions.length} (${pct}%)</p>${it.questions.map((q,i)=>`<div class="qa"><div style="font-weight:600;font-size:17px;margin-bottom:8px">${i+1}. ${esc(q.q)}</div>${q.options.map((o,j)=>{
    const right=j===q.correct,mine=j===answers[i];
    return `<div class="ao ${right?'right':(mine?'wrong':'')}"><span>${esc(o)}</span>${right?`<span class="lab" style="color:var(--ok)">${mine?'Your answer · Correct':'Correct answer'}</span>`:(mine?`<span class="lab" style="color:var(--danger)">Your answer</span>`:'')}</div>`}).join('')}</div>`).join('')}<button class="btn ghost" id="retry">Try again</button>`;
  $('#retry',box).onclick=()=>paintQuiz(box,it);
  paintAttempts(it);
  $('#qres',box).scrollIntoView({block:'start'});
}
async function paintAttempts(it){
  const at=(await DB.all('attempts')).filter(a=>a.quizId===it.id).sort((a,b)=>b.createdAt-a.createdAt);

async function isPdf(file){
  if(!(file.type==='application/pdf'||/\.pdf$/i.test(file.name)))return false;
  try{return new TextDecoder().decode(await file.slice(0,5).arrayBuffer())==='%PDF-'}catch(e){return false}
}

async function noteForm(existing){

  function setBlob(b,name){
    clearBlob();blob=b;fileName=name||'';url=URL.createObjectURL(b);
    vp.srcObject=null;vp.muted=false;vp.controls=true;
    vp.onerror=()=>{info('Your browser cannot play this video format. Try an MP4 or WebM file.',true);blob=null;$m('#fsub').disabled=true};
    vp.src=url;$m('#fsub').disabled=false;
    info(`Ready to publish · ${fmtSize(b.size)}`);ui('done');
  }
  function cleanup(){
    closed=true;clearInterval(timer);
    try{if(rec&&rec.state!=='inactive')rec.stop()}catch(e){}
    stopStream();if(url)URL.revokeObjectURL(url);
  }
  const tick=()=>{const s=Math.floor((acc+(state==='recording'?Date.now()-startedAt:0))/1000);$m('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  $m('#b-cam').onclick=async()=>{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){info('Recording is not supported in this browser. You can upload a video file instead.',true);return}
    info('Waiting for camera permission…');
    try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}catch(ex){info(permMsg(ex),true);return}
    if(closed){stopStream();return}
    vp.srcObject=stream;vp.muted=true;vp.controls=false;vp.play().catch(()=>{});info('Camera is on. Press Start recording when ready.');ui('live');
  };
  $m('#b-start').onclick=()=>{
    chunks=[];
    const mt=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    try{rec=new MediaRecorder(stream,mt?{mimeType:mt}:undefined)}catch(ex){info('This browser could not start recording: '+ex.message,true);return}
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=()=>{
      clearInterval(timer);if(closed)return;
      const type=rec.mimeType||mt||'video/webm';stopStream();
      if(!chunks.length){info('Nothing was recorded. Please try again.',true);ui('idle');return}
      setBlob(new Blob(chunks,{type}),'Recording');
    };
    rec.onerror=()=>info('Recording stopped because of an error.',true);
    acc=0;startedAt=Date.now();rec.start(1000);ui('recording');info('Recording…');
    clearInterval(timer);timer=setInterval(tick,250);tick();
  };
  $m('#b-pause').onclick=()=>{
    if(state==='recording'){if(typeof rec.pause!=='function')return;rec.pause();acc+=Date.now()-startedAt;ui('paused');info('Paused.')}
    else if(state==='paused'){rec.resume();startedAt=Date.now();ui('recording');info('Recording…')}
  };
  $m('#b-stop').onclick=()=>{if(state==='paused')acc+=0;rec.stop()};
  $m('#b-redo').onclick=()=>{clearBlob();ui('idle')};
  $$('[data-tab]',m.el).forEach(tb=>tb.onclick=()=>{
    if(state==='recording'||state==='paused')return toast('Stop recording first.');
    const to=tb.dataset.tab;if(to===source)return;
    source=to;stopStream();clearBlob();
    $$('[data-tab]',m.el).forEach(x=>x.classList.toggle('on',x===tb));
    show('#prec',to==='rec');show('#pup',to==='up');$m('#vfile').value='';ui('idle');
    $m('#vph').textContent=to==='rec'?'Record with your camera and microphone, or upload a video from your device.':'Choose a video file from your device to preview it here.';
  });
  $m('#vfile').onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const ok=(file.type||'').startsWith('video/')||/\.(mp4|webm|mov|m4v|ogv|mkv)$/i.test(file.name);
    if(!ok){clearBlob();e.target.value='';ui('idle');info('That is not a supported video file.',true);return}
    setBlob(file,file.name);
    const f=$m('#vf');if(!f.title.value)f.title.value=file.name.replace(/\.[^.]+$/,'');
  };
  ui('idle');
  $m('#vf').onsubmit=async e=>{
    e.preventDefault();showErr(m,'');
    if(!blob)return showErr(m,'Record or choose a video first.');
    const meta=readMeta(new FormData(e.target));if(!meta.title)return showErr(m,'Please add a title.');
    const b=$m('#fsub');b.disabled=true;b.textContent='Saving to your browser…';
    const recd={id:uid(),...meta,file:blob,mime:blob.type||'',fileName,size:blob.size,createdAt:Date.now()};
    try{await DB.put('videos',recd)}catch(ex){b.disabled=false;b.textContent='Publish video';return showErr(m,storageMsg(ex))}
    m.close();toast('Video published.');go('#/videos');
  };
}

const blankQ=()=>({q:'',options:['',''],correct:-1});
async function quizForm(existing){
  const subs=await subjectList();
  let qs=existing?JSON.parse(JSON.stringify(existing.questions)):[blankQ()];
  const m=openModal(existing?'Edit quiz':'Create a quiz',`<form class="form" id="qf">
  <label>Title<input name="title" required maxlength="140" value="${esc(existing&&existing.title)}"></label>
  <label>Description<textarea name="description" rows="2" maxlength="2000">${esc(existing&&existing.description)}</textarea></label>
  <label>Subject (optional)<input name="subject" list="dl-sub" maxlength="60" value="${esc(existing&&existing.subject)}"></label>
  <datalist id="dl-sub">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <div id="qlist"></div>
  <button type="button" class="btn ghost" id="addq">${ic('plus',16)} Add question</button>
  <p class="sub" style="margin-top:10px">Select the round button next to the correct answer for each question.</p>
  ${formFoot(existing?'Save changes':'Publish quiz')}</form>`,{wide:true,sticky:true});
  const list=$('#qlist',m.el);
  const paint=()=>{list.innerHTML=qs.map((q,i)=>`<fieldset class="qb"><legend>Question ${i+1}</legend>
    <input class="qt" data-qi="${i}" placeholder="Question text" aria-label="Question ${i+1}" value="${esc(q.q)}">
    ${q.options.map((o,j)=>`<div class="opt"><input type="radio" name="c${i}" data-ci="${i}" data-oj="${j}" ${q.correct===j?'checked':''} aria-label="Mark option ${j+1} correct"><input class="ot" data-qi="${i}" data-oj="${j}" placeholder="Option ${j+1}" aria-label="Option ${j+1}" value="${esc(o)}">${q.options.length>2?`<button type="button" class="x2" data-rmo="${i}:${j}" aria-label="Remove option">×</button>`:''}</div>`).join('')}
    <div class="row" style="margin-top:10px">${q.options.length<6?`<button type="button" class="lnk" data-addo="${i}">+ Add option</button>`:''}${qs.length>1?`<button type="button" class="lnk danger" data-rmq="${i}">Remove question</button>`:''}</div></fieldset>`).join('')};
  paint();
  list.addEventListener('input',e=>{
    const t=e.target;
    if(t.classList.contains('qt'))qs[+t.dataset.qi].q=t.value;
    if(t.classList.contains('ot'))qs[+t.dataset.qi].options[+t.dataset.oj]=t.value;
  });
  list.addEventListener('change',e=>{const t=e.target;if(t.dataset.ci!==undefined)qs[+t.dataset.ci].correct=+t.dataset.oj});
  list.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.addo!==undefined){qs[+b.dataset.addo].options.push('')}
    else if(b.dataset.rmo){const [i,j]=b.dataset.rmo.split(':').map(Number);const q=qs[i];q.options.splice(j,1);if(q.correct===j)q.correct=-1;else if(q.correct>j)q.correct--}
    else if(b.dataset.rmq!==undefined){qs.splice(+b.dataset.rmq,1)}
    else return;
    paint();
  });
  $('#addq',m.el).onclick=()=>{qs.push(blankQ());paint();const f=$$('.qb',list).pop();if(f)f.scrollIntoView({block:'center'})};
  $('#qf',m.el).onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.target);const title=fd.get('title').trim();
    if(!title)return showErr(m,'Please add a quiz title.');
    if(!qs.length)return showErr(m,'Add at least one question.');
    for(let i=0;i<qs.length;i++){
      const q=qs[i],n=i+1;
      if(!q.q.trim())return showErr(m,`Question ${n} needs text.`);
      if(q.options.length<2)return showErr(m,`Question ${n} needs at least two options.`);
      if(q.options.some(o=>!o.trim()))return showErr(m,`Question ${n} has an empty option. Fill it in or remove it.`);
      if(q.correct<0||q.correct>=q.options.length)return showErr(m,`Select the correct answer for question ${n}.`);
    }
    const questions=qs.map(q=>({q:q.q.trim(),options:q.options.map(o=>o.trim()),correct:q.correct}));
    const base={title,description:fd.get('description').trim(),subject:fd.get('subject').trim(),questions};
    const rec=existing?{...existing,...base,updatedAt:Date.now()}:{id:uid(),...base,createdAt:Date.now()};
    try{
      if(existing&&JSON.stringify(existing.questions)!==JSON.stringify(questions))
        for(const a of await DB.all('attempts'))if(a.quizId===existing.id)await DB.del('attempts',a.id);
      await DB.put('quizzes',rec);
    }catch(ex){return showErr(m,storageMsg(ex))}
    m.close();toast(existing?'Quiz updated.':'Quiz published.');go(existing?S.route:'#/quizzes');
  };
}

/* ---------- In-site video call: WebRTC mesh, signalled through the database ---------- */
const RTC_CFG={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
function liveCallUI(tok,id){
  const box=$('#rlive');if(!box)return;
  const pid=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');
  const name=((S.me&&S.me.name)||getNick()||'Guest').slice(0,40);
  let stream=null,pcs={},unsubs=[],hb=null,joined=false,mic=true,cam=true,dbc=null;
  const idle=msg=>{
    box.innerHTML=`<p class="sub" style="margin-bottom:10px">Video or voice, without leaving Orbital. Your browser will ask for camera and microphone access (microphone only for voice calls).</p><div class="row"><button class="btn" id="lstart">${ic('video',16)} Join video call</button><button class="btn ghost" id="lvoice">${ic('phone',16)} Join voice call</button></div>${msg?`<p class="fine" style="margin-top:8px">${msg}</p>`:''}`;
    $('#lstart').onclick=()=>start(false);$('#lvoice').onclick=()=>start(true);
  };
  function addTile(k,label,ms,me){
    const g=$('#vgrid');if(!g)return;let t=$('[data-k="'+k+'"]',g);
    if(!t){t=document.createElement('div');t.className='vtile';t.dataset.k=k;t.innerHTML='<video autoplay playsinline></video><span class="vname"></span>';g.appendChild(t)}
    const v=$('video',t);v.muted=!!me;v.srcObject=ms;$('.vname',t).textContent=label;
    t.dataset.i=(label.trim()[0]||'?').toUpperCase();t.classList.toggle('aud',!ms.getVideoTracks().length);
    if(v.play)v.play().catch(()=>{});
  }
  function dropPeer(k){
    const p=pcs[k];if(p){try{p.pc.close()}catch(e){}delete pcs[k]}
    const t=$('[data-k="'+k+'"]');if(t)t.remove();
  }
  const gathered=pc=>new Promise(r=>{
    if(pc.iceGatheringState==='complete')return r();
    const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};
    pc.addEventListener('icegatheringstatechange',f);setTimeout(r,4000);
  });
  function mk(peerId,peerName){
    const pc=new RTCPeerConnection(RTC_CFG);pcs[peerId]={pc};
    stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    pc.ontrack=e=>{if(e.streams[0])addTile(peerId,peerName,e.streams[0])};
    pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed')dropPeer(peerId)};
    return pc;
  }
  const desc=d=>d&&typeof d.sdp==='string'&&(d.type==='offer'||d.type==='answer')?{type:d.type,sdp:d.sdp}:null;
  async function offerPeer(sig,peerId,peerName){
    try{
      const pc=mk(peerId,peerName);
      await pc.setLocalDescription(await pc.createOffer());await gathered(pc);
      await sig.doc(pid+'_'+peerId).set({from:pid,to:peerId,name,offer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp},at:Date.now()});
    }catch(e){dropPeer(peerId)}
  }
  async function answerPeer(sig,docId,d){
    const off=desc(d.offer);if(!off)return;
    try{
      const pc=mk(d.from,String(d.name||'Guest').slice(0,40));
      await pc.setRemoteDescription(off);
      await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
      await sig.doc(docId).update({answer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});
    }catch(e){dropPeer(d.from)}
  }
  function join(){
    joined=true;const t0=Date.now();
    const base=dbc.doc('rooms/'+id),mem=base.collection('members'),sig=base.collection('sig');
    box.innerHTML=`<div class="vgrid" id="vgrid"></div><div class="row"><button class="btn ghost" id="lmic">${mic?'Mute mic':'Unmute mic'}</button><button class="btn ghost" id="lcam" ${stream.getVideoTracks().length?'':'disabled'}>Turn camera off</button><button class="btn" id="lleave">Leave call</button></div><p class="fine" style="margin-top:8px">People in the room who join the video call appear here. Up to 5 people work best.</p>`;
    addTile('me',name+' (you)',stream,true);
    $('#lmic').onclick=e=>{mic=!mic;stream.getAudioTracks().forEach(t=>t.enabled=mic);e.target.textContent=mic?'Mute mic':'Unmute mic'};
    $('#lcam').onclick=e=>{cam=!cam;stream.getVideoTracks().forEach(t=>t.enabled=cam);e.target.textContent=cam?'Turn camera off':'Turn camera on'};
    $('#lleave').onclick=async()=>{await stop();idle()};
    mem.doc(pid).set({name,at:t0,joined:t0}).catch(()=>toast('Could not join the call. You may need Contributor access to this page.'));
    hb=setInterval(()=>mem.doc(pid).update({at:Date.now()}).catch(()=>{}),10000);
    unsubs.push(sig.where('to','==',pid).onSnapshot(sn=>sn.docChanges().forEach(ch=>{
      if(ch.type==='removed')return;const d=ch.doc.data();
      if(d&&d.offer&&!d.answer&&typeof d.from==='string'&&!pcs[d.from]&&Date.now()-d.at<120000)answerPeer(sig,ch.doc.id,d);
    })));
    unsubs.push(sig.where('from','==',pid).onSnapshot(sn=>sn.docChanges().forEach(ch=>{
      const d=ch.doc.data(),p=d&&pcs[d.to],a=d&&desc(d.answer);
      if(p&&a&&!p.pc.currentRemoteDescription)p.pc.setRemoteDescription(a).catch(()=>{});
    })));
    unsubs.push(mem.onSnapshot(sn=>{
      sn.docs.forEach(m=>{
        const d=m.data();
        if(m.id===pid||!d||pcs[m.id]||Date.now()-d.at>30000||!(d.joined<t0))return;
        offerPeer(sig,m.id,String(d.name||'Guest').slice(0,40));
      });
      sn.docChanges().forEach(ch=>{if(ch.type==='removed')dropPeer(ch.doc.id)});
    }));
  }
  async function start(audioOnly){
    $$('#lstart,#lvoice').forEach(b=>{b.disabled=true});
    dbc=await getDbCap();
    if(!dbc)return idle('Live video needs the published Orbital page and a signed-in account.');
    try{const P=await claude.use('permissions');if(P)await P.request()}catch(e){}
    const md=navigator.mediaDevices;
    if(!md||!md.getUserMedia||!window.RTCPeerConnection)return idle('This browser or page does not support live video. Use the call link below instead.');
    try{stream=await md.getUserMedia({video:audioOnly?false:{width:{ideal:640},height:{ideal:480}},audio:{echoCancellation:true,noiseSuppression:true}});if(audioOnly)cam=false}
    catch(e){try{stream=await md.getUserMedia({audio:true});cam=false}catch(e2){return idle('Camera or microphone access was blocked. Allow it in your browser\u2019s site settings and try again. If it is blocked by the page itself, use the call link below.')}}
    if(tok!==S.tok){stream.getTracks().forEach(t=>t.stop());return}
    join();
  }
  async function stop(){

    const mine=[];let seq=0;
    $('#rcf').onsubmit=async e=>{

const CLASSROOM={doubts:[],seq:0};
async function vClassroom(tok){
  if(!setMain(tok,`<div class="ph"><div><h1>Live Classroom</h1><p class="sub" style="margin:2px 0 0">Anonymous doubts and teacher replies, separate from Group Study.</p></div></div>

  <p class="notice">Prototype: the student and teacher views both run in this one browser tab and share temporary data kept in memory. Nothing is sent to other devices, and everything clears when you refresh the page.</p>
  <div class="cls">
    <section class="clscol" aria-labelledby="stu-h"><h2 class="lbl-h" id="stu-h">Student view</h2>
      <form id="dform"><label for="dtext">Your doubt</label><textarea id="dtext" rows="3" maxlength="500" required placeholder="Type your doubt. It is posted anonymously."></textarea><div class="row" style="justify-content:space-between"><span class="sub" id="dcount">0 / 500</span><button class="btn">Ask anonymously</button></div></form>
      <div id="sfeed" aria-live="polite"></div></section>
    <section class="clscol" aria-labelledby="tea-h"><h2 class="lbl-h" id="tea-h">Teacher dashboard</h2><p class="sub" id="tstat"></p><div id="tfeed" aria-live="polite"></div></section>
  </div>`))return;
  const clean=t=>String(t).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f​-‏‪-‮⁠-⁯﻿]/g,'').trim();
  const D=CLASSROOM.doubts;
  const fresh=new Set(D.filter(d=>Date.now()-d.at<4000).map(d=>d.id));
  const reps=d=>d.replies.map(r=>`<div class="rep"><b>Teacher</b> · <span class="sub">${ago(r.at)}</span><p class="pre" style="margin:2px 0 0">${esc(r.text)}</p></div>`).join('');
  function paint(){
    const mine=[...D].sort((a,b)=>b.at-a.at);
    $('#sfeed').innerHTML=mine.length?mine.map(d=>`<div class="dq ${fresh.has(d.id)?'fresh':''}"><div class="byline"><b>Anonymous Student</b><span>·</span><span>${ago(d.at)}</span>${d.replies.length?'':'<span class="tag st">Waiting for reply</span>'}</div><p class="pre">${esc(d.text)}</p>${reps(d)}</div>`).join(''):'<p class="muted" style="margin-top:12px">No doubts yet. Ask the first one.</p>';
    const open=D.filter(d=>!d.replies.length).length;
    $('#tstat').textContent=D.length?`${open} open · ${D.length-open} answered`:'';
    $('#cs-all').textContent=D.length;$('#cs-open').textContent=open;$('#cs-done').textContent=D.length-open;
    const keep={};$$('.rform input',$('#tfeed')).forEach(i=>{keep[i.dataset.id]=i.value});
    const af=document.activeElement&&document.activeElement.matches&&document.activeElement.matches('.rform input')?document.activeElement.dataset.id:null;
    const list=[...D].sort((a,b)=>(!!a.replies.length-!!b.replies.length)||b.at-a.at);
    $('#tfeed').innerHTML=list.length?list.map(d=>`<div class="dq ${fresh.has(d.id)?'fresh':''}"><div class="byline"><b>Anonymous Student</b><span>·</span><span>${ago(d.at)}</span><span class="tag st">${d.replies.length?'Answered':'Open'}</span></div><p class="pre">${esc(d.text)}</p>${reps(d)}<form class="rform" data-id="${d.id}"><input data-id="${d.id}" maxlength="500" placeholder="Reply to this doubt" aria-label="Reply to this doubt" required><button class="btn ghost">Reply</button></form></div>`).join(''):'<p class="muted" style="margin-top:12px">No doubts yet.</p>';
    $$('.rform input',$('#tfeed')).forEach(i=>{if(keep[i.dataset.id])i.value=keep[i.dataset.id]});
    if(af){const i=$(`.rform input[data-id="${af}"]`,$('#tfeed'));if(i)i.focus()}
    fresh.clear();
  }
  paint();
  $('#dtext').oninput=e=>{$('#dcount').textContent=e.target.value.length+' / 500'};
  $('#dform').onsubmit=e=>{
    e.preventDefault();const text=clean($('#dtext').value);if(!text)return;
    const d={id:++CLASSROOM.seq,text:text.slice(0,500),at:Date.now(),replies:[]};
    D.push(d);fresh.add(d.id);$('#dtext').value='';$('#dcount').textContent='0 / 500';
    paint();toast('Doubt posted anonymously.');
  };
  $('#tfeed').onsubmit=e=>{
    const f=e.target.closest('form.rform');if(!f)return;e.preventDefault();
    const d=D.find(x=>x.id===+f.dataset.id);const text=clean($('input',f).value);if(!d||!text)return;
    d.replies.push({text:text.slice(0,500),at:Date.now()});fresh.add(d.id);$('input',f).value='';paint();toast('Reply sent.');
  };
  const iv=setInterval(paint,30000);S.cleanups.push(()=>clearInterval(iv));
}

const taken=new Set(["S2","S5","S7","S10","S12","S15","S18","S21","S22","S27","S30","S33","S36","S41","S44","S47"]);let pick=null;
function renderSeats(){let h="";for(let i=1;i<=50;i++){const id="S"+i;h+=`<button class="cf-seat" data-s="${id}" aria-pressed="${pick===id}" ${taken.has(id)?"disabled":""}>${id}</button>`}
$("#seatgrid").innerHTML=h;$("#seatgrid").querySelectorAll(".cf-seat").forEach(s=>s.onclick=()=>{pick=pick===s.dataset.s?null:s.dataset.s;renderSeats()})}
const codeOf=b=>'LIB-'+String(BOOKS.indexOf(b)+1).padStart(3,'0');
const esc2=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const borrowed=[];
let stream=null,tmr=0,detector=null,scanning=false;
function findBook(txt){
  const t=String(txt||'').trim();if(!t)return null;
  const m=/LIB-?(\d{1,3})/i.exec(t);
  if(m){const b=BOOKS[+m[1]-1];if(b)return b}
  const lo=t.toLowerCase();return BOOKS.find(b=>b.t.toLowerCase()===lo)||null;
}
function showResult(raw){
  const b=findBook(raw),box=$("#scanout");
  if(!b){box.innerHTML=`<div class="cf-ok">No book found for this code${raw?': '+esc2(String(raw).slice(0,60)):''}. Try again or type the code.</div>`;return}
  const has=borrowed.some(x=>x.b===b);
  box.innerHTML=`<div class="cf-detail"><h3 style="margin:0 0 4px">${esc2(b.t)}</h3><p style="margin:0 0 6px">${esc2(b.a)} · ${esc2(b.g)}</p><p style="margin:0 0 8px">${esc2(b.s)}</p><p style="margin:0 0 10px"><b>Code:</b> ${codeOf(b)}<br><b>Location:</b> Shelf ${esc2(b.shelf)}<br><b>Rent:</b> ₹${b.rent} per day</p>${has?'<span class="cf-tag">Already borrowed</span>':'<button class="cf-btn" id="borrow">Borrow this book</button>'}</div>`;
  const bt=$("#borrow");if(bt)bt.onclick=()=>{borrowed.push({b,due:Date.now()+7*864e5});renderBorrowed();showResult(raw)};
}
function renderBorrowed(){
  const box=$("#borrowed");if(!box)return;
  box.innerHTML=borrowed.length?'<h3 style="margin:18px 0 8px">Borrowed books</h3>'+borrowed.map((x,i)=>`<div class="cf-item"><span>${esc2(x.b.t)}<small style="display:block;color:var(--muted)">Due ${new Date(x.due).toLocaleDateString(undefined,{day:"numeric",month:"short"})} · ₹${x.b.rent} per day</small></span><button class="cf-btn alt" data-ret="${i}">Return</button></div>`).join(''):'';
  box.querySelectorAll("[data-ret]").forEach(r=>r.onclick=()=>{borrowed.splice(+r.dataset.ret,1);renderBorrowed();$("#scanout").innerHTML='<div class="cf-ok">Book returned. Thank you.</div>'});
}
async function loadJsQR(){
  if(window.jsQR)return window.jsQR;
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
  return window.jsQR;
}
async function decode(src,w,h){
  if('BarcodeDetector' in window){
    try{detector=detector||new BarcodeDetector();const r=await detector.detect(src);if(r.length)return r[0].rawValue}catch(e){}
  }
  try{
    const q=await loadJsQR();const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);
    const r=q(x.getImageData(0,0,w,h).data,w,h);return r?r.data:null;
  }catch(e){return null}
}
function stopScan(){
  scanning=false;clearTimeout(tmr);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const v=$("#scanvid");if(v){v.srcObject=null;v.hidden=true}
  const b=$("#scango");if(b)b.textContent="Start camera";
}
async function startScan(){
  const md=navigator.mediaDevices,msg=$("#scanmsg");
  if(!md||!md.getUserMedia){msg.textContent="Camera scanning is not available here. Use Scan from photo or type the code.";return}
  try{stream=await md.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})}
  catch(e){msg.textContent="Camera access was blocked. Allow it in your browser settings, or use Scan from photo or type the code.";return}
  const v=$("#scanvid");v.srcObject=stream;v.hidden=false;await v.play().catch(()=>{});
  $("#scango").textContent="Stop camera";scanning=true;msg.textContent="Point the camera at the book's QR code or barcode.";
  const tick=async()=>{
    if(!scanning)return;
    if(v.videoWidth){
      const w=Math.min(v.videoWidth,640),h=Math.round(v.videoHeight*w/v.videoWidth);
      const val=await decode(v,w,h);
      if(val&&scanning){stopScan();msg.textContent="Scanned.";showResult(val);return}
    }
    tmr=setTimeout(tick,250);
  };
  tick();
}
function wireScan(){
  $("#scango").onclick=()=>stream?stopScan():startScan();
  $("#scanfile").onchange=async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;const msg=$("#scanmsg");msg.textContent="Reading the photo…";
    try{
      const bm=await createImageBitmap(f),sc=Math.min(1,1000/Math.max(bm.width,bm.height));
      const val=await decode(bm,Math.round(bm.width*sc),Math.round(bm.height*sc));
      if(val){msg.textContent="Scanned.";showResult(val)}else msg.textContent="No code found in that photo. Try a closer, sharper picture.";
    }catch(err){msg.textContent="Could not read that image."}
  };
  $("#codeform").onsubmit=e=>{e.preventDefault();showResult($("#codein").value)};
  $("#codelist").innerHTML=BOOKS.map(b=>`<div class="cf-item"><span>${esc2(b.t)}</span><span class="cf-tag">${codeOf(b)}</span></div>`).join('');
  renderBorrowed();
}

function wire(root){wireScan();
root.querySelectorAll(".cf-tabs button").forEach(b=>b.onclick=()=>{
root.querySelectorAll(".cf-tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
["books","scan","seats"].forEach(id=>$("#"+id).hidden=id!==b.dataset.tab);if(b.dataset.tab!=="scan")stopScan()});
$("#q").oninput=renderBooks;renderBooks();
renderSeats();
$("#confirm").onclick=()=>{const m=$("#seatmsg");
if(!pick){m.innerHTML='<div class="cf-ok">Choose a free seat first.</div>';return}
taken.add(pick);m.innerHTML=`<div class="cf-ok">Seat ${pick} is booked for ${$("#slot").value}. Show this screen at the help desk.</div>`;pick=null;renderSeats()};
}
return root=>{$=s=>root.querySelector(s);wire(root);S.cleanups.push(stopScan)};
})();

/* ---------- Profile ---------- */
async function vProfile(tok,q){
  const tab=q.get('tab')||'notes';
  const [notes,videos,quizzes,posts,eng,marks]=await Promise.all([DB.all('notes'),DB.all('videos'),DB.all('quizzes'),DB.all('posts'),loadEng(),DB.all('bookmarks')]);
  const tag=(arr,t)=>arr.map(x=>({...x,_t:t})).sort((a,b)=>b.createdAt-a.createdAt);
  const data={notes:tag(notes,'notes'),videos:tag(videos,'videos'),quizzes:tag(quizzes,'quizzes'),posts:tag(posts,'posts')};
  const saved=[];
  for(const b of marks){const it=await DB.get(b.type,b.targetId);if(it)saved.push({...it,_t:b.type,createdAt:it.createdAt})}
  saved.sort((a,b)=>b.createdAt-a.createdAt);data.saved=saved;
  const p=S.me;
  const d=[p.college,p.branch,p.semester&&('Semester '+p.semester)].filter(Boolean).join(' · ');
  const tabs=[['notes','Notes'],['videos','Videos'],['quizzes','Quizzes'],['posts','Posts'],['saved','Saved']];
  if(!setMain(tok,`<div class="row" style="align-items:flex-start;gap:16px;flex-wrap:nowrap">${avatar(p,76)}<div style="flex:1;min-width:0"><h1>${esc(p.name||'Anonymous student')}</h1>${d?`<div class="sub">${esc(d)}</div>`:''}${p.bio?`<p class="pre" style="margin-top:8px">${esc(p.bio)}</p>`:''}</div><button class="btn ghost" data-act="edit-profile">${ic('edit',16)} Edit profile</button></div>
  <div class="tabs">${tabs.map(([k,l])=>`<a class="tab ${tab===k?'on':''}" href="#/profile?tab=${k}">${l} (${data[k].length})</a>`).join('')}</div><div id="pres" style="margin-top:14px"></div>
  <p class="fine" style="margin-top:28px">Saved in this browser only. Clearing site data removes it.</p>`))return;
  paintList($('#pres'),data[tab]||[],eng,emptyState(tab==='saved'?'Nothing saved yet.':'No content shared yet.'));
}
function fileToAvatar(file){return new Promise((res,rej)=>{
  if(!file.type.startsWith('image/'))return rej(new Error('Please choose an image file.'));
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=256,c=document.createElement('canvas');c.width=c.height=s;const r=Math.max(s/img.width,s/img.height),w=img.width*r,h=img.height*r;c.getContext('2d').drawImage(img,(s-w)/2,(s-h)/2,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That image could not be read.'))};img.src=u;
})}
function profileForm(){
  const p=S.me;let newAvatar=null,removeAv=false;
  const m=openModal('Edit profile',`<form class="form" id="prf">
  <div class="row" style="margin-bottom:12px"><span id="avp">${avatar(p,64)}</span><div><input type="file" id="avf" accept="image/*" aria-label="Profile picture"><button type="button" class="lnk" id="avr" style="margin-top:4px">Remove picture</button></div></div>
  <label>Display name<input name="name" maxlength="60" value="${esc(p.name)}"></label>
  <label>Bio<textarea name="bio" rows="3" maxlength="300">${esc(p.bio)}</textarea></label>
  <label>College (optional)<input name="college" maxlength="100" value="${esc(p.college)}"></label>
  <div class="grid3" style="grid-template-columns:1fr 1fr"><label>Branch (optional)<input name="branch" maxlength="60" value="${esc(p.branch)}"></label><label>Semester (optional)<input name="semester" maxlength="20" value="${esc(p.semester)}"></label></div>
  ${formFoot('Save profile')}</form>`);
  $('#avf',m.el).onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{newAvatar=await fileToAvatar(f);removeAv=false;$('#avp',m.el).innerHTML=avatar({avatar:newAvatar},64);showErr(m,'')}catch(ex){showErr(m,ex.message);e.target.value=''}
  };
  $('#avr',m.el).onclick=()=>{removeAv=true;newAvatar=null;$('#avf',m.el).value='';$('#avp',m.el).innerHTML=avatar({name:$('#prf',m.el).name.value},64)};
  $('#prf',m.el).onsubmit=async e=>{
    e.preventDefault();const fd=new FormData(e.target);
    const rec={...p,name:fd.get('name').trim(),bio:fd.get('bio').trim(),college:fd.get('college').trim(),branch:fd.get('branch').trim(),semester:fd.get('semester').trim(),avatar:removeAv?'':(newAvatar||p.avatar||'')};
    try{await DB.put('profiles',rec)}catch(ex){return showErr(m,storageMsg(ex))}
    S.me=rec;refreshChrome();m.close();toast('Profile saved.');render();
  };
}

/* ---------- Actions ---------- */
async function toggle(store,a){
  const t=a.dataset.t,id=a.dataset.id,key=t+':'+id,kind=a.dataset.act;
  let on;
  try{
    const ex=await DB.get(store,key);
    if(ex){await DB.del(store,key);on=false}else{await DB.put(store,{id:key,type:t,targetId:id,createdAt:Date.now()});on=true}
  }catch(ex){return toast(storageMsg(ex))}
  $$(`[data-act="${kind}"][data-t="${t}"][data-id="${id}"]`).forEach(b=>{b.classList.toggle('on',on);b.innerHTML=btnInner(kind,on)});
}
const ACTIONS={
  like:a=>toggle('likes',a),
  mark:a=>toggle('bookmarks',a),
  open:a=>go(a.dataset.href),
  jump:()=>{const b=$('#cbox');if(b)b.scrollIntoView({behavior:'smooth'})},
  create:()=>createMenu(),
  subject:a=>go('#/discover?subject='+encodeURIComponent(a.dataset.s)),
  'new-post':()=>postForm(),
  'new-note':()=>noteForm(),
  'new-video':()=>videoForm(),
  'new-quiz':()=>quizForm(),
  'new-group':()=>createRoomForm(),
  'edit-profile':()=>profileForm(),
  edit:async a=>{const it=await DB.get(a.dataset.t,a.dataset.id);if(it)editItem(a.dataset.t,it)},
  delete:async a=>{
    const t=a.dataset.t,id=a.dataset.id;
    if(!await confirmBox(`Delete this ${LABEL[t].toLowerCase()}? This cannot be undone.`))return;
    try{await removeItem(t,id)}catch(ex){return toast(storageMsg(ex))}
    toast('Deleted.');
    if(parseHash().seg[1]===id)go(t==='posts'?'#/':'#/'+t);else render();
  },
  dl:async a=>{
    const n=await DB.get('notes',a.dataset.id);if(!n)return;
    const fname=(n.title.replace(/[\\/:*?"<>|]+/g,'').trim()||'note')+'.pdf';
    try{
      const dl=window.claude&&claude.use?await Promise.race([claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),1500))]):null;
      if(dl){await dl.save({filename:fname,data:n.file});return}
    }catch(ex){if(ex&&ex.code==='declined')return}
    const u=URL.createObjectURL(n.file),l=document.createElement('a');
    l.href=u;l.download=fname;document.body.appendChild(l);l.click();l.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
  },
  'del-comment':async a=>{
    const box=a.closest('#cbox');
    try{await DB.del('comments',a.dataset.id)}catch(ex){return toast(storageMsg(ex))}
    paintComments(box);
  },
  'copy-link':()=>{const i=$('#rlink');if(i)copyLink(i.value,i)},
  'share-link':a=>shareRoom(a.dataset.id),
  'forget-room':a=>{saveRooms(getRooms().filter(r=>r.id!==a.dataset.id));render()}
};
document.addEventListener('click',async e=>{
  const lk=e.target.closest('a[href^="#/"]');
  if(lk&&!e.defaultPrevented){e.preventDefault();go(lk.getAttribute('href'));return}
  const a=e.target.closest('[data-act]');
  if(a){e.preventDefault();const fn=ACTIONS[a.dataset.act];if(fn)try{await fn(a,e)}catch(ex){console.error(ex);toast('Something went wrong.')}return}
  const o=e.target.closest('[data-open]');
  if(o&&!e.target.closest('a,button,input,textarea,select,video,label'))go(o.dataset.open);
});


/* ---------- boot ---------- */
(async function boot(){
  try{
    _db=await openDB();
    _db.onversionchange=()=>{_db.close()};
    await loadMe();
  }catch(e){
    $('#main').innerHTML=`<div class="empty"><p><b>Orbital can't start.</b></p><p>${esc(e.message||e)}</p><p class="sub">Orbital stores your content in your browser's IndexedDB. Private browsing modes or blocked site data can prevent this.</p></div>`;
    return;
  }
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  const rid=roomFromHash();if(rid)S.route='#/room/'+rid;
  shell();render();
})();
window.addEventListener('hashchange',()=>{const id=roomFromHash();if(id&&S.route!=='#/room/'+id&&_db)go('#/room/'+id)});
</script>
